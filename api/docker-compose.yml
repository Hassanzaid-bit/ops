services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qzone
      POSTGRES_PASSWORD: qzone
      POSTGRES_DB: qzone
    ports:
      - "5432:5432"
    volumes:
      - qzone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qzone -d qzone"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qzone
      MINIO_ROOT_PASSWORD: qzoneqzone
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qzone_minio_data:/data

volumes:
  qzone_pg_data:
  qzone_minio_data:
